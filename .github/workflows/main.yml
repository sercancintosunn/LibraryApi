name: Build LibraryHub

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore backend
        run: dotnet restore ./LibraryApi.slnx

      - name: Build backend
        run: dotnet build ./LibraryApi.slnx --configuration Release --no-restore

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: library-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: library-frontend

      - name: Build frontend
        run: npm run build
        working-directory: library-frontend
